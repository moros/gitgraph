[package]
name = "gitpeek"
version = "0.1.0"
edition = "2021"
description = "A TUI git commit explorer combining git log graph with file tree diff viewing"

[[bin]]
name = "gpeek"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rayon = "1.11"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tui-tree-widget = "0.24"
tui-input = "0.15"
ansi-to-tui = "8.0"
strip-ansi-escapes = "0.2"
fuzzy-matcher = "0.3"
laurier = "0.3"
arboard = "3.6"
umbra = "0.4"
garde = { version = "0.22", features = ["derive"] }
dirs = "6.0"
rustc-hash = "2"
base64 = "0.22"
once_cell = "1"
console = "0.15"

[dev-dependencies]
dircpy = "0.3"
tempfile = "3"
text-to-png = "0.2"
